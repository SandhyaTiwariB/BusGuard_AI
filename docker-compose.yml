version: '3.8'

services:
  busguard-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: busguard-ai-monitor
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3

